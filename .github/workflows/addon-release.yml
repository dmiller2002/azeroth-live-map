name: Forever addon / CurseForge
on:
  push:
    tags: ['addon-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing addon-v* release tag
        required: true
        type: string
      publish:
        description: Upload this addon to the configured CurseForge project
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  addon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y luajit
      - run: npm ci
      - run: npm test
      - name: Build addon only (no uploads)
        uses: BigWigsMods/packager@v2.6.1
        with:
          args: -d -g forever -n 'DrunksAzerothUI-{project-version}-Forever'
      - name: Validate installable package
        run: python3 scripts/validate_addon_zip.py .release/*.zip
      - uses: actions/upload-artifact@v4
        with:
          name: DrunksAzerothUI-Forever-addon
          path: .release/*.zip
      - name: Check CurseForge configuration
        if: ${{ inputs.publish == true }}
        env:
          CF_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          [[ "$CF_PROJECT_ID" =~ ^[1-9][0-9]*$ ]] || { echo 'Set the CURSEFORGE_PROJECT_ID repository variable.'; exit 1; }
          [[ -n "$CF_API_TOKEN" ]] || { echo 'Set the CF_API_TOKEN repository secret.'; exit 1; }
          [[ "$RELEASE_TAG" == addon-v* ]] || { echo 'Publishing requires an addon-v* release tag.'; exit 1; }
          git describe --exact-match --tags HEAD
      - name: Upload validated addon to CurseForge
        if: ${{ inputs.publish == true }}
        uses: BigWigsMods/packager@v2.6.1
        with:
          args: -c -g forever -p ${{ vars.CURSEFORGE_PROJECT_ID }} -n 'DrunksAzerothUI-{project-version}-Forever'
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}

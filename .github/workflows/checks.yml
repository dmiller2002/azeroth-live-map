name: Checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y luajit
      - run: npm ci
      - run: npm test
      - run: npm run package:addon
      - run: python3 scripts/validate_addon_zip.py app/DrunksAzerothUI.zip
      - run: npm run release:source
      - uses: actions/upload-artifact@v4
        with:
          name: forever-addon-and-source
          path: |
            app/DrunksAzerothUI.zip
            release/1.0.0/*source.zip

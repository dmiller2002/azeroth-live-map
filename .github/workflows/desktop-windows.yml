name: Desktop / Windows
# Builds the Windows 11 x64 installer, portable ZIP and updater metadata on a
# real Windows runner (no Wine) and attaches them to the matching GitHub release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v* release tag to build and attach
        required: true
        type: string
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build Windows installer and portable ZIP
        run: npm run build:windows
      - name: Collect Windows release files
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          [[ "$RELEASE_TAG" == "v$version" ]] || { echo "Tag $RELEASE_TAG does not match package.json $version"; exit 1; }
          dir="release/$version"
          mkdir -p upload
          cp "$dir"/*-Windows-Setup.exe "$dir"/*-Windows-Setup.exe.blockmap "$dir"/*-win-x64.zip "$dir"/latest.yml upload/
          ls -la upload
      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ env.RELEASE_TAG }}
          path: upload/*
          if-no-files-found: error
      - name: Attach to GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" upload/* --clobber
          else
            echo "No release for $RELEASE_TAG yet; files are in the workflow artifact."
          fi
